<!-- Thought of the Day: Add this just after the opening <body> tag -->
<style>
#thought-of-the-day {
  width: 100%;
  background: linear-gradient(90deg, #7a1f00, #c95a00, #7a1f00);
  color: #ffffff;
  padding: 9px 0;
  overflow: hidden;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  font-family: "Noto Sans Devanagari", Arial, sans-serif;
  font-weight: 700;
  font-size: 18px;
  position: relative;
  z-index: 9999;
}

#thought-of-the-day .label {
  display: inline-block;
  background: #ffd54f;
  color: #5b1a00;
  padding: 5px 12px;
  margin-left: 12px;
  border-radius: 20px;
  font-size: 15px;
}

#thought-of-the-day .marquee {
  display: inline-block;
  padding-left: 100%;
  animation: thoughtMove 18s linear infinite;
}

@keyframes thoughtMove {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

@media (max-width: 600px) {
  #thought-of-the-day { font-size: 15px; padding: 8px 0; }
  #thought-of-the-day .label { font-size: 12px; margin-left: 6px; }
}
</style>

<div id="thought-of-the-day">
  <span class="label">✨ आज का विचार</span>
  <span class="marquee">
    “जो लोग पानी से नहाते हैं, वे सिर्फ़ कपड़े बदलते हैं; और जो लोग पसीने से नहाते हैं, वे इतिहास बदलते हैं।”
  </span>
</div>
